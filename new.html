<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8" />
  <title>Quiz with 5s Countdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #ff7a00;
      --muted: #eee;
      --ok: #166f39;
      --bad: #ef4444;
      --text: #222;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fffaf5;
      color: var(--text)
    }

    .card {
      width: min(720px, 92vw);
      background: #fff;
      border: 1px solid #f2e8df;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .06)
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    h1 {
      font-size: 20px;
      margin: 0 0 10px
    }

    .meta {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px
    }

    /* Timer */
    .timer {
      background: var(--muted);
      border-radius: 999px;
      height: 14px;
      overflow: hidden;
      position: relative;
      margin: 8px 0 18px;
      border: 1px solid #e8e8e8
    }

    .bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--primary), #ffb703);
      transition: width .1s linear;
    }

    .time-text {
      font-weight: 600
    }

    /* Options */
    .opts {
      display: grid;
      gap: 10px
    }

    .btn {
      text-align: left;
      padding: 14px 16px;
      border: 1px solid #eee;
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      font-size: 16px;
      transition: transform .06s ease, box-shadow .2s;
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    .btn[disabled] {
      opacity: .6;
      cursor: not-allowed
    }

    .btn.correct {
      border-color: var(--ok);
      background: #ecfdf5
    }

    .btn.wrong {
      border-color: var(--bad);
      background: #fef2f2
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px
    }

    .pill {
      padding: 6px 10px;
      background: #fff7ed;
      border: 1px solid #ffe1c2;
      border-radius: 999px;
      font-size: 12px
    }

    .hidden {
      display: none
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="row">
      <h1 id="title">Quiz</h1>
      <div class="pill" id="qProg">Q 1/1</div>
    </div>
    <div class="meta">
      <span class="time-text" id="timeText">5</span> seconds remaining
    </div>

    <div class="timer" aria-label="Countdown timer">
      <div class="bar" id="bar"></div>
    </div>

    <div id="question" style="font-size:18px;font-weight:600;margin-bottom:12px;">Question text</div>

    <div class="opts" id="options"></div>

    <div class="footer">
      <div id="status" class="pill">Pick an option</div>
      <button id="nextBtn" class="btn" style="padding:10px 16px;font-weight:600">Next ▶</button>
    </div>

    <div id="result" class="hidden" style="margin-top:14px;font-weight:600;"></div>
  </div>

  <script>
    // ==== Quiz Data ====
    const quiz = [
      {
        q: "HTML ka full form kya hai?",
        options: ["Hyperlinks and Text Markup Language", "Home Tool Markup Language", "Hyper Text Markup Language", "Hyperlinks Text Makeup Language"],
        answer: 2 // zero-based index
      },
      {
        q: "CSS me text ko bold kaise karte hain?",
        options: ["font-weight: bold;", "text-bold: true;", "font-style: bold;", "weight: 700;"],
        answer: 0
      },
      {
        q: "JavaScript me array ki length ka property?",
        options: [".count", ".size", ".length", ".items"],
        answer: 2
      }
    ];

    // ==== State ====
    const DURATION_MS = 5000; // 5 seconds per question
    const STEP_MS = 100;      // smooth bar update
    let idx = 0;
    let score = 0;
    let ticking = null;
    let startAt = 0;
    let locked = false; // prevent multiple answers

    // ==== DOM ====
    const qEl = document.getElementById("question");
    const optsEl = document.getElementById("options");
    const timeText = document.getElementById("timeText");
    const bar = document.getElementById("bar");
    const statusEl = document.getElementById("status");
    const nextBtn = document.getElementById("nextBtn");
    const qProg = document.getElementById("qProg");
    const resultEl = document.getElementById("result");
    const titleEl = document.getElementById("title");

    nextBtn.addEventListener("click", () => goNext(true));

    init();

    function init() {
      titleEl.textContent = "5s Countdown Quiz";
      renderQuestion();
    }

    function renderQuestion() {
      clearTimer();
      locked = false;
      resultEl.classList.add("hidden");
      statusEl.textContent = "Pick an option";
      nextBtn.disabled = true;

      const item = quiz[idx];
      qProg.textContent = `Q ${idx + 1}/${quiz.length}`;
      qEl.textContent = item.q;

      // options
      optsEl.innerHTML = "";
      item.options.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = text;
        btn.dataset.index = i;
        btn.addEventListener("click", () => choose(i));
        optsEl.appendChild(btn);
      });

      // reset timer UI
      timeText.textContent = (DURATION_MS / 1000).toFixed(0);
      bar.style.width = "100%";

      // start timer
      startTimer();
    }

    function startTimer() {
      startAt = performance.now();
      ticking = setInterval(() => {
        const elapsed = performance.now() - startAt;
        const remain = Math.max(0, DURATION_MS - elapsed);
        // update number (ceil to avoid showing 0 too early)
        timeText.textContent = Math.ceil(remain / 1000);
        // update bar
        const pct = (remain / DURATION_MS) * 100;
        bar.style.width = pct + "%";

        if (remain <= 0) {
          timeUp();
        }
      }, STEP_MS);
    }

    function clearTimer() {
      if (ticking) {
        clearInterval(ticking);
        ticking = null;
      }
    }

    function disableOptions() {
      [...optsEl.children].forEach(b => b.disabled = true);
    }

    function choose(i) {
      if (locked) return;
      locked = true;
      clearTimer();
      const correct = quiz[idx].answer;

      // style options
      [...optsEl.children].forEach((b, k) => {
        b.disabled = true;
        if (k === correct) b.classList.add("correct");
        if (k === i && i !== correct) b.classList.add("wrong");
      });

      if (i === correct) {
        score++;
        statusEl.textContent = "✅ Correct!";
      } else {
        statusEl.textContent = "❌ Wrong. Correct highlighted.";
      }

      nextBtn.disabled = false;
      // auto-next after short delay
      setTimeout(() => goNext(false), 900);
    }

    function timeUp() {
      clearTimer();
      disableOptions();
      const correct = quiz[idx].answer;
      [...optsEl.children].forEach((b, k) => {
        if (k === correct) b.classList.add("correct");
      });
      statusEl.textContent = "⏰ Time up!";
      nextBtn.disabled = false;
      setTimeout(() => goNext(false), 900);
    }

    function goNext(manualClick) {
      if (idx < quiz.length - 1) {
        idx++;
        renderQuestion();
      } else {
        finish();
      }
    }

    function finish() {
      clearTimer();
      qEl.textContent = "Quiz Completed 🎉";
      optsEl.innerHTML = "";
      document.querySelector(".timer").style.display = "none";
      timeText.textContent = "0";
      statusEl.textContent = "Done";
      nextBtn.disabled = true;
      resultEl.classList.remove("hidden");
      resultEl.textContent = `Your Score: ${score}/${quiz.length}`;
      qProg.textContent = "Done";
    }

    // (Optional) Keyboard support: 1-4 keys to select quickly
    window.addEventListener("keydown", (e) => {
      const map = { "1": 0, "2": 1, "3": 2, "4": 3 };
      if (map.hasOwnProperty(e.key)) {
        const i = map[e.key];
        const btn = optsEl.children[i];
        if (btn && !btn.disabled) choose(i);
      }
    });
  </script>
</body>

</html>
