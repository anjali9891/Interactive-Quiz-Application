<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <div class="main">
        <div class="image">
            <!-- <img src="./signup image.png" style="height: 100%; width:100%; object-fit: contain;"> -->
        </div>
        <div class="box">
            <div class="center">
                <div class="head">
                    <article style="font-size: 40px; font-weight: bold;">Sign Up</article>
                    <div class="line">
                        <article style="font-size: 25px;">Get Started</article>
                    </div>
                </div>
                <div class="new">
                    <div class="no">
                        <input type="text" id="phone" placeholder="Phone Number"><br>
                    </div>
                    <div class="no">
                        <input type="password" id="password" placeholder="Password"><br>
                    </div>
                    <div class="change">
                        <button onclick="check()">Sign Up</button>
                    </div>
                    <h1 class="strong" style="font-size: 13px;">Have an account?<a href="./login.html"> Login Here</a></h1>
                </div>
            </div>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
    
</html>
