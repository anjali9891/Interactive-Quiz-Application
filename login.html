<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="main">
        <div class="image">
            <!-- <img src="./login image.png" style="height: 100%; width:100%; object-fit: contain;"> -->
        </div>
        <div class="box">
            <div class="center">
                <div class="head">
                    <article style="font-size: 40px; font-weight: bold;">Login Here</article>
                    <div class="line">
                        <article style="font-size: 25px;">Welcome Back</article>
                    </div>
                </div>
                <div class="new">
                    <div class="no">
                        <input type="text" id="phone" placeholder="Phone Number"><br>
                    </div>
                    <div class="no">
                        <input type="password" id="password" placeholder="Password"><br>
                    </div>
                    <div class="change">
                        <button onclick="store()">Login</button>
                    </div>
                    <p id="loginError" class="error" style="display: none;"></p>
                    <h1 class="strong" style="font-size: 13px;">Don't have an account?<a href="./signup.html"> Signup Here</a></h1>
                </div>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>

</html>
